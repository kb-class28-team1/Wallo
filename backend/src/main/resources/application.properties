db.driverClassName=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/wallo?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
db.username=root
db.password=
codef.mock-api.base-url=http://localhost:8080

# 금융 리포트 자동 생성 스케줄러 (news_report가 없는 뉴스를 찾아 순차 생성)
# OPENAI_API_KEY가 없는 로컬 환경에서 의도치 않게 AI가 호출되지 않도록 기본값은 false로 둔다.
# 실제로 켤 때만 true로 바꿔서 사용할 것.
financial-report.scheduler.enabled=false
# 한 번 실행될 때 처리할 최대 뉴스 건수.
financial-report.scheduler.batch-size=10

# financial_term 매칭 캐시(FinancialTermMatchingServiceImpl)를 다시 만드는 주기(ms). 기본 1시간.
# financial_term은 사람이 드물게 수동으로 적재/수정하므로 실시간 반영은 필요 없고, 이 주기 이내에만
# 반영되면 충분하다고 판단했다.
financial-term.cache.refresh-interval-ms=3600000
