plugins {
    id "java"
    id "war"
}

group = "com.wallo"
version = "1.0.0"

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

ext {
    springVersion           = '5.3.39'
    springBatchVersion      = '4.3.10'
    mybatisVersion          = '3.5.16'
    mybatisSpringVersion    = '2.1.2'
    mysqlConnectorVersion   = '8.4.0'
    hikariCPVersion         = '5.1.0'
    seleniumVersion         = '4.23.0'
    webdrivermanagerVersion = '5.9.2'
    jacksonVersion          = '2.17.2'
    logbackVersion          = '1.5.6'
    servletApiVersion       = '4.0.1'
    junitVersion            = '5.10.2'
    lombokVersion           = '1.18.34'
    springfoxVersion        = '3.0.0'
}

dependencies {
    // Spring MVC (spring-web, context, beans, core, aop, expression 전이 포함)
    implementation "org.springframework:spring-webmvc:${springVersion}"
    implementation "org.springframework:spring-context:${springVersion}"
    implementation "org.springframework:spring-tx:${springVersion}"
    implementation "org.springframework:spring-jdbc:${springVersion}"

    // 서블릿 API - Tomcat 9가 런타임에 제공, 컴파일 전용
    compileOnly "javax.servlet:javax.servlet-api:${servletApiVersion}"

    // MyBatis + Spring 연동
    implementation "org.mybatis:mybatis:${mybatisVersion}"
    implementation "org.mybatis:mybatis-spring:${mybatisSpringVersion}"

    // MySQL 드라이버
    runtimeOnly "com.mysql:mysql-connector-j:${mysqlConnectorVersion}"

    // 커넥션 풀
    implementation "com.zaxxer:HikariCP:${hikariCPVersion}"

    // Spring Batch
    implementation "org.springframework.batch:spring-batch-core:${springBatchVersion}"

    // 크롤링용 Selenium
    implementation "org.seleniumhq.selenium:selenium-java:${seleniumVersion}"
    implementation "io.github.bonigarcia:webdrivermanager:${webdrivermanagerVersion}"

    // JSON 응답 처리
    implementation "com.fasterxml.jackson.core:jackson-databind:${jacksonVersion}"
    // LocalDateTime 등 java.time 타입 직렬화 지원 (없으면 InvalidDefinitionException 발생)
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:${jacksonVersion}"

    // 로깅
    implementation "ch.qos.logback:logback-classic:${logbackVersion}"

    // Swagger (Spring Boot 미사용 환경이라 springdoc의 Boot 자동설정 대신 springfox + @EnableSwagger2WebMvc 사용)
    implementation "io.springfox:springfox-swagger2:${springfoxVersion}"
    implementation "io.springfox:springfox-swagger-ui:${springfoxVersion}"

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // 테스트
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.springframework:spring-test:${springVersion}"
    testImplementation "org.mockito:mockito-core:5.13.0"
    testImplementation "javax.servlet:javax.servlet-api:${servletApiVersion}"

    testRuntimeOnly "org.junit.vintage:junit-vintage-engine"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

war {
    archiveFileName = "ROOT.war"
}

test {
    useJUnitPlatform()
}
